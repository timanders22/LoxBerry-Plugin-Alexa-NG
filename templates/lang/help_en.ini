[HILFE]
K01 = "Alexa NG – announcements from Loxone"
K02 = "The plugin lets Echo devices speak, announce, set the volume and start released routines – via an HTTP endpoint and optionally via MQTT. It uses the unofficial web interface of alexa.amazon.de; Amazon may change it at any time."
K03 = "Login: you log in once directly at amazon.de (tab Amazon login). The plugin never sees your password, only a one-time code, and afterwards stores only the refresh token (file 0600, never shown)."
K04 = "Two tokens: the speech token for announcements and volume, the action token additionally for routines. Routines only run from the release list."
K05 = "Brake: the same text within 30 s is not repeated; at most 60 commands per hour; at least 1 s spacing towards Amazon."
K06 = "The tab Test answers without Loxone whether the setup works."
K07 = "Speech-safe names: announcements use the normal name. Choose short, unique names; a name ending in _2 means two devices have the same name at Amazon. Voice triggers of routines without music, station or genre words, otherwise Alexa takes them as a music request."
K08 = "Lock from Loxone (off by default): Loxone holds announcements, e.g. when away or sleeping; dringend=1 passes, volume and routines still work. A device that is gone stays visible in the tab Devices, with a note where its name is still used."
K09 = "Music test (off by default; measured on one Echo on 02.10.2026, TuneIn station by number): plays a station from the station list by number via the search of the Echo – unofficial interface, no arbitrary stream, no own MP3."
K10 = "Radio per zone (off by default): zone table 1–24 to an Echo, an Amazon group or an own group; station by number from the station list; commands via HTTP with the action token and via MQTT, Loxone template in the tab Loxone integration. The lock from Loxone and the quiet time do not apply to radio. Several zones at once are only tested against the mock."
K11 = "Hue test (off by default; measured: on port 8380 the Echo never queried, on an own network address it found and switched the test light): measures whether an Echo finds a Hue bridge emulation. Set the tick in the tab Settings, start “Discover devices” (Philips Hue) in the Alexa app, have “Loxone Probe” switched on and check the tab Test. Echo devices of the newer generation partly no longer support the local Hue discovery – exactly this is what the test measures. Switching only goes to MQTT (not retained), never to Loxone controls."
K12 = "Radio per zone: if nr=0 arrives (radio buttons without a chosen button), the plugin stops the zone. Vanished devices can be removed in the tab Devices with “remove”; until then a call to them answers 404 GRUND=GERAET_VERSCHWUNDEN."
K13 = "Hue test on own network address (decision no. 41, off by default): the Echo never queried a bridge on port 8380. With the kind “own network address (Docker)” the plugin creates a container with an own IP in the home network (macvlan on eth0) that listens on port 80 and 1900; Apache stays untouched. The IP (pattern 192.168.178.x) must be free and lie outside the DHCP range of the Fritzbox or be reserved there. From the LoxBerry itself the own address cannot be reached (macvlan) – that is normal; the tab Test asks the container via its bridge address."
K14 = "Version 2 – lights for Alexa (off by default, list empty by default): per light name, kind (switch, light (on/off) or dimmer) and code. If an Echo switches a light, the plugin sends alexang/hue/<code>/ein (1/0) and for a dimmer …/helligkeit (0–100) as soon as Alexa sets a brightness (plain switching on: only …/ein) via MQTT, not retained; Loxone may report back …/status and …/status_helligkeit, then Alexa shows the real state. The same value within 2 s goes out only once, more than 10 commands per light and minute get an error answer. Names with door, gate, garage, alarm or lock need the tick “release deliberately”. With a list of Echo addresses only these switch; empty means all in the home network. If the kind of a light is changed (switch, light, dimmer), delete the light in the Alexa app and then “Discover devices”. Alexa remembers the kind per device; it cannot be changed in the app."
