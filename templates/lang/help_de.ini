[HILFE]
K01 = "Alexa NG – Ansagen aus Loxone"
K02 = "Das Plugin lässt Echo-Geräte sprechen, ankündigen, die Lautstärke setzen und freigegebene Routinen starten – über einen HTTP-Endpunkt und optional über MQTT. Es benutzt die inoffizielle Web-Schnittstelle von alexa.amazon.de; Amazon kann sie jederzeit ändern."
K03 = "Anmeldung: Sie melden sich einmal direkt bei amazon.de an (Reiter Amazon-Anmeldung). Das Plugin sieht nie Ihr Kennwort, sondern nur einen Einmal-Code, und speichert danach nur das Erneuerungs-Token (Datei 0600, nie angezeigt)."
K04 = "Zwei Token: das Sprechtoken für Ansagen und Lautstärke, das Aktionstoken zusätzlich für Routinen. Routinen laufen nur aus der Freigabeliste."
K05 = "Bremse: derselbe Text innerhalb von 30 s wird nicht wiederholt; höchstens 60 Befehle je Stunde; zu Amazon mindestens 1 s Abstand."
K06 = "Der Reiter Test beantwortet ohne Loxone, ob die Einrichtung trägt."
K07 = "Sprachsichere Namen: Für Ansagen zählt der Normalname. Kurze, eindeutige Namen wählen; ein Name auf _2 heißt, zwei Geräte heißen bei Amazon gleich. Sprachauslöser von Routinen ohne Musik-, Sender- oder Genrewörter, sonst fängt Alexa sie als Musikwunsch ab."
K08 = "Sperre aus Loxone (ab Werk aus): Loxone hält Ansagen an, etwa bei Abwesend oder Schlafen; dringend=1 geht durch, Lautstärke und Routinen gelten weiter. Ein verschwundenes Gerät bleibt im Reiter Geräte sichtbar, mit dem Hinweis, wo sein Name noch steht."
K09 = "Musik-Probe (ab Werk aus, nicht am Gerät erprobt): spielt einen Sender aus der Senderliste nach Nummer über die Suche des Echos – inoffizielle Schnittstelle, kein beliebiger Stream, keine eigene MP3."
