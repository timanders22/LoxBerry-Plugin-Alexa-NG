; ERZEUGT von Pruefung-Alexa-NG/proben/ax_sprache_erzeugen.py - nicht von Hand aendern.

[HILFE]
K01 = "Alexa NG – Ansagen aus Loxone"
K02 = "Das Plugin lässt Echo-Geräte sprechen, ankündigen, die Lautstärke setzen und freigegebene Routinen starten – über einen HTTP-Endpunkt und optional über MQTT. Es benutzt die inoffizielle Web-Schnittstelle von alexa.amazon.de; Amazon kann sie jederzeit ändern."
K03 = "Anmeldung: Sie melden sich einmal direkt bei amazon.de an (Reiter Amazon-Anmeldung). Das Plugin sieht nie Ihr Kennwort, sondern nur einen Einmal-Code, und speichert danach nur das Erneuerungs-Token (Datei 0600, nie angezeigt)."
K04 = "Zwei Token: das Sprechtoken für Ansagen und Lautstärke, das Aktionstoken zusätzlich für Routinen. Routinen laufen nur aus der Freigabeliste."
K05 = "Bremse: derselbe Text innerhalb von 30 s wird nicht wiederholt; höchstens 60 Befehle je Stunde; zu Amazon mindestens 1 s Abstand."
K06 = "Der Reiter Test beantwortet ohne Loxone, ob die Einrichtung trägt."
K07 = "Sprachsichere Namen: Für Ansagen zählt der Normalname. Kurze, eindeutige Namen wählen; ein Name auf _2 heißt, zwei Geräte heißen bei Amazon gleich. Sprachauslöser von Routinen ohne Musik-, Sender- oder Genrewörter, sonst fängt Alexa sie als Musikwunsch ab."
K08 = "Sperre aus Loxone (ab Werk aus): Loxone hält Ansagen an, etwa bei Abwesend oder Schlafen; dringend=1 geht durch, Lautstärke und Routinen gelten weiter. Ein verschwundenes Gerät bleibt im Reiter Geräte sichtbar, mit dem Hinweis, wo sein Name noch steht."
K09 = "Musik-Probe (ab Werk aus; am 02.10.2026 an einem Echo gemessen, TuneIn-Sender nach Nummer): spielt einen Sender aus der Senderliste nach Nummer über die Suche des Echos – inoffizielle Schnittstelle, kein beliebiger Stream, keine eigene MP3."
K10 = "Radio je Zone (ab Werk aus): Zonentabelle 1–24 auf einen Echo, eine Amazon-Gruppe oder eine eigene Gruppe; Sender nach Nummer aus der Senderliste; Befehle über HTTP mit dem Aktionstoken und über MQTT, Loxone-Vorlage im Reiter Einbindung in Loxone. Die Sperre aus Loxone und die Ruhezeit gelten für Radio nicht. Mehrere Zonen gleichzeitig sind nur an der Attrappe geprüft."
K11 = "Hue-Probe (ab Werk aus; gemessen: auf Port 8380 fragte das Echo nie ab, auf eigener Netzadresse fand und schaltete es die Probe-Lampe): misst, ob ein Echo eine Hue-Bridge-Nachbildung findet. Haken im Reiter Einstellungen setzen, in der Alexa-App „Geräte suchen“ (Philips Hue), „Loxone Probe“ einschalten lassen und im Reiter Test nachsehen. Echo-Geräte der neueren Generation unterstützen die lokale Hue-Suche zum Teil nicht mehr – genau das misst die Probe. Schalten geht nur flüchtig an MQTT, nie an Loxone-Steuerungen."
K12 = "Radio je Zone: Kommt nr=0 an (Radiotasten ohne gewählte Taste), hält das Plugin die Zone an. Verschwundene Geräte lassen sich im Reiter Geräte mit „austragen“ entfernen; bis dahin antwortet ein Aufruf an sie mit 404 GRUND=GERAET_VERSCHWUNDEN."
K13 = "Hue-Probe auf eigener Netzadresse (Entscheidung Nr. 41, ab Werk aus): das Echo fragte eine Bridge auf Port 8380 nie ab. Mit der Art „eigene Netzadresse (Docker)“ legt das Plugin einen Container mit eigener IP im Heimnetz an (macvlan an eth0), der auf Port 80 und 1900 lauscht; Apache bleibt unberührt. Die IP (Muster 192.168.178.x) muss frei sein und in der Fritzbox außerhalb des DHCP-Bereichs liegen oder reserviert sein. Vom LoxBerry selbst ist die eigene Adresse nicht erreichbar (macvlan) – das ist normal; der Reiter Test fragt den Container über seine Brückenadresse."
K14 = "Fassung 2 – Lampen für Alexa (ab Werk aus, Liste ab Werk leer): je Lampe Name, Art (Schalter, Licht (an/aus) oder Dimmer) und Kürzel. Schaltet ein Echo eine Lampe, sendet das Plugin flüchtig alexang/hue/<Kürzel>/ein (1/0) und beim Dimmer …/helligkeit (0–100), sobald Alexa eine Helligkeit setzt (beim bloßen Einschalten nur …/ein), über MQTT; Loxone darf …/status und …/status_helligkeit zurückmelden, dann zeigt Alexa den echten Zustand. Gleicher Wert binnen 2 s geht nur einmal hinaus, mehr als 10 Befehle je Lampe und Minute bekommen eine Fehlerantwort. Namen mit Tür, Tor, Garage, Alarm oder Schloss brauchen den Haken „bewusst freigeben“. Mit einer Liste von Echo-Adressen schalten nur diese; leer heißt alle im Heimnetz. Wird die Art einer Lampe geändert (Schalter, Licht, Dimmer), die Lampe in der Alexa-App löschen und danach „Geräte suchen“. Alexa merkt sich die Art je Gerät, in der App lässt sie sich nicht ändern."
