R_HINWEIS="Die Ansagen sind ab Werk an. Ausschalten: oben bei der Ausgabeart „aus“ wählen und speichern; das bleibt auch nach einem Update aus. Ein Ziel, das noch nicht eingerichtet ist, wird übergangen."
L_R_ANLAESSE="Das wird angesagt"
R_ANLAESSE_HINWEIS="Eigene Haken, getrennt von den Benachrichtigungen: Ein Ereignis lässt sich lesen, ohne es zu hören."
L_R_NACHTRUHE="Nachtruhe einhalten"
R_NACHT_HINWEIS="In der Nachtruhe entfällt eine Ansage und wird nicht nachgeholt; sie steht im Protokoll. Dringendes spricht trotzdem."
