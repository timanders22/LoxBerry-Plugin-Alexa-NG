P_HUE_ECHOS = "leer = alle im Heimnetz"
HUE_ECHOS_HILFE = "Nur diese Echos dürfen die Lampen abfragen und schalten: IP-Adressen im Netz der Schnittstelle oben, getrennt durch Komma oder Leerzeichen (Muster 192.168.178.x), höchstens 20. Leer (ab Werk) heißt: alle Geräte im Heimnetz. Anfragen anderer Adressen bekommen eine Fehlerantwort der Hue-Schnittstelle und werden im Reiter Test gezählt. Die Echos brauchen dann feste Adressen (in der Fritzbox reservieren)."
