SPERRE_HILFE = "Loxone setzt die Sperre etwa bei Abwesend, Gäste oder Schlafen: aktion=sperre&wert=1 mit dem Aktionstoken oder das MQTT-Thema befehl/sperre mit 1, aufheben mit 0 (Adressen im Reiter Einbindung in Loxone). Gesperrt werden Ansagen und Ankündigungen übersprungen (409, GRUND=GESPERRT, nicht als gesendet gemeldet); dringend=1 geht durch. Lautstärke, Routinen und die Musik-Probe gelten weiter. Der letzte Wert bleibt erhalten; nach einem Update ist er weg, dann gilt „offen“, bis Loxone ihn neu setzt – der Reiter Test zeigt das an."
