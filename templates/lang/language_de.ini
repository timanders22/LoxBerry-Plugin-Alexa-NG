L_RADIO = "Radio je Zone erlauben (ab Werk aus, mehrere Zonen nicht am Gerät erprobt)"
RADIO_HILFE = "Spielt je Zone einen Sender aus der Senderliste (oben, nach Nummer) über denselben direkten Musikbefehl wie die Musik-Probe – inoffizielle Schnittstelle. Am Gerät belegt ist ein Echo; mehrere Zonen gleichzeitig sind nur an der Attrappe geprüft. Kein beliebiger Stream, keine Adresse, keine eigene MP3. Befehle nur mit dem Aktionstoken: aktion=radio, radio_stopp und radio_laut mit zone=1–24 oder alle (Adressen im Reiter Einbindung in Loxone). Die Sperre aus Loxone und die Ruhezeit gelten für Radio nicht. Derselbe Sender, ein Stopp oder dieselbe Lautstärke in derselben Zone binnen 60 s wird nicht erneut gesendet (UNVERAENDERT=1). Die Musik-Stundengrenze gilt für alle Zonen zusammen. Ohne Haken antwortet der Endpunkt mit 409 GRUND=RADIO_AUS."
L_RADIO_ZONEN = "Zonentabelle (je Zeile: Nummer = Ziel)"
P_RADIO_ZONEN = "1 = kueche · 2 = amazon:unten · 3 = gruppe:oben"
RADIO_ZONEN_HILFE = "Nummer 1 bis 24, jede nur einmal. Ziel ist der Normalname eines Echos (Reiter Geräte), amazon:<name> für eine Mehrraum-Musikgruppe der Alexa-App (als Ganzes, synchron – ungemessen) oder gruppe:<name> für eine eigene Gruppe von oben (jedes Gerät einzeln, nicht synchron). Kleinschreibung wie im Reiter Geräte. Ab Werk leer."
H_HUE = "Alexa → Loxone (Hue-Lampen, Fassung 2)"
L_HUE = "Hue-Nachbildung einschalten"
HUE_HILFE = "Fassung 2: eine Nachbildung einer Hue-Bridge im Heimnetz, damit Alexa Lampen schaltet, die Loxone steuert – lokal, ohne Cloud. Ab Werk aus. Mit Haken läuft ein eigener Dienst: er beantwortet die Suche nach einer Bridge (SSDP, UDP-Port 1900, nur als Antwort an den Suchenden) und zeigt die Lampen der Liste unten, dazu – mit eigenem Haken – die Probe-Lampe „Loxone Probe“. Schaltet ein Echo eine Lampe, geht nur alexang/hue/<Kürzel>/ein (1 oder 0, flüchtig) und beim Dimmer …/helligkeit über MQTT hinaus; was daraus wird, entscheidet Ihre Logik in Loxone. Ablauf: Lampen eintragen, Haken setzen, Speichern; in der Alexa-App „Geräte suchen“ (Philips Hue) oder „Alexa, suche Geräte“; im Reiter Test nachsehen. Gemessen am 03.10.2026: ein Echo fand die Nachbildung auf eigener Netzadresse (Port 80), fragte die Probe-Lampe ab und schaltete sie; auf Port 8380 fragte es nie ab. Ebenso gemessen am 03.10.2026: ein Echo fand Lampen der Liste und schaltete sie. Echo-Geräte der neueren Generation unterstützen die lokale Hue-Suche zum Teil nicht mehr. Deshalb gibt es unten die Art „eigene Netzadresse (Docker)“: die Nachbildung bekommt eine eigene IP im Heimnetz und lauscht dort auf Port 80."
HUE_PORT_HILFE = "HTTP-Port der Nachbildung auf dem LoxBerry, 1024 bis 65535, ab Werk 8380. Nicht 80: dort läuft der LoxBerry-Webserver. Gilt nur für die Art „auf dem LoxBerry“; mit eigener Netzadresse ist es immer Port 80. Ist der Port belegt, zeigt der Reiter Test den Grund."
ZU_HUE_TEST = "Messstand der Hue-Probe im Reiter Test"
O_HUE_LOXBERRY = "auf dem LoxBerry (Port wie bisher)"
O_HUE_DOCKER = "eigene Netzadresse (Docker)"
HUE_ART_HILFE = "Auf dem LoxBerry: der Dienst lauscht auf dem Port oben (nicht 80). Eigene Netzadresse: ein Container mit eigener IP lauscht auf Port 80 – für Echos, die eine Bridge nur dort abfragen."
P_HUE_IP = "192.168.178.x"
HUE_IP_HILFE = "Pflicht bei „eigene Netzadresse“: eine freie IPv4 im Netz der Schnittstelle (Muster 192.168.178.x), nicht .0 oder .255, nicht die Adresse des LoxBerry, nicht die des Routers. Sie muss in der Fritzbox außerhalb des DHCP-Bereichs liegen oder dort reserviert sein. Beim Speichern wird nachgesehen, ob schon ein Gerät sie benutzt (ping und ARP). Ab Werk leer."
HUE_SCHNITTSTELLE_HILFE = "Die Schnittstelle des LoxBerry zum Heimnetz, ab Werk eth0. Die eigene IP muss in ihrem Netz liegen."
HUE_DOCKER_HINWEIS = "Eigene Netzadresse (Entscheidung Nr. 41, am 03.10.2026 an einem Echo gemessen): das Plugin legt über Docker einen Container lb-alexang-hue an – mit eigener IP im Heimnetz (Netz lb-alexang-macvlan, macvlan an der Schnittstelle) und zusätzlich am Docker-Netz bridge, damit er den MQTT-Broker auf dem LoxBerry erreicht. Darin läuft nur der eigene Dienst dieses Plugins, auf dem offiziellen Abbild php:8.4-cli (beim ersten Mal am LoxBerry gebaut: Internet nötig, einige Minuten). Apache, Webport und Loxone-Adressen bleiben unberührt. Docker muss installiert sein. Vom LoxBerry selbst ist die eigene Adresse nicht erreichbar (macvlan) – das ist normal. Ohne Haken oder bei Art „auf dem LoxBerry“ werden Container und Netz entfernt; das Abbild bleibt."
H_HUE_LAMPEN = "Lampen für Alexa (Freigabeliste)"
HUE_LAMPEN_HILFE = "Je Zeile eine Lampe, wie Alexa sie nennt (höchstens 32 Zeichen, eindeutig), die Art und ein Kürzel für das MQTT-Thema (nur Kleinbuchstaben, Ziffern und _; bleibt es leer, wird es beanstandet und ein Vorschlag aus dem Namen steht im Feld). Art: Schalter für Steckdosen, Pumpen und Ähnliches (die Alexa-App zeigt einen An-/Ausschalter); Licht (an/aus) für Lampen ohne Dimmen – gedacht, damit Raumbefehle wie „Alexa, Licht aus“ sie einschließen (die Alexa-App zeigt sie als Lampe; ob ein Raumbefehl sie einschließt, ist am Echo nicht gemessen); Dimmer für Lampen mit Helligkeit. Namen mit Tür, Tor, Garage, Alarm oder Schloss (auch englisch) brauchen den Haken „bewusst freigeben“ – im Heimnetz kann jeder freigegebene Echo sie schalten. Höchstens 50 Lampen. Ab Werk ist die Liste leer."
L_HUE_PROBE_LAMPE = "Probe-Lampe „Loxone Probe“ zeigen"
HUE_PROBE_LAMPE_HILFE = "Die Probe-Lampe aus Fassung 0.9.5 (Hue-ID 1); sie schaltet nur alexang/hue_probe/ein. Ab Werk sichtbar, damit ein Update nichts wegnimmt. Laufen die eigenen Lampen, kann der Haken weg; Alexa zeigt „Loxone Probe“ dann als nicht erreichbar, bis Sie sie in der Alexa-App löschen."
