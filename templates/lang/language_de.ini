BS1_S1 = "Im Plugin Reiter „%s“ anmelden; der Reiter „%s“ zeigt Ihre Echos mit „Normalname“ (z. B. kueche) – „%s“ probieren."
BS1_S2 = "Reiter „%s“: „%s“ wählen, Haken „Sperre aus Loxone annehmen“ setzen und unter „%s“ die Namen Ihrer Alexa-Routinen eintragen (im Muster „Gute Nacht“ und „Haus verlassen“; die genauen Namen zeigt der Reiter „%s“ mit „%s“). Speichern."
BS1_S3 = "Reiter „MQTT“: „%s“, „%s“ und „%s“ setzen, für die Routinen zusätzlich „%s“. Speichern."
BS1_S4 = "Im MQTT-Gateway die Werte freigeben (Schritt 1 oben) und je Name der Namenstabelle (Schritt 2) einen Virtuellen Eingang anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang), Titel genau wie in der Tabelle, „Als Digitaleingang verwenden“ nicht anhaken. alexang_letzte_grund wird ein Virtueller Texteingang, „In Visualisierung verwenden“ an."
BS1_S5 = "Die Befehle (Nr. 3, 6, 9, 13, 15, 16) als Virtuelle Ausgangsbefehle am Ausgang „LoxBerry MQTT-Gateway“ anlegen, Befehl wie in der Liste – oder in Schritt 3 „%s“ drücken und die Datei einmal einlesen (Baum links Virtuelle Ausgänge → Menüband Vordefinierte Geräte → Vorlage Importieren…)."
BS1_S6 = "Seite „Alexa NG“ anlegen und die Ein- und Ausgänge der Liste auf die Seite ziehen. „Türklingel (eigene Quelle)“, „Niemand zu Hause (eigene Quelle)“ und „Konstante 1“ aus dem Baum nehmen, wenn es sie schon gibt. Neu anlegen: Schieberegler „Alexa Küche Lautstärke (Proz)“, Schalter „Alexa-Ansagen sperren“, Taste „Routine Gute Nacht“."
BS1_S7 = "Zwei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung): „Alexa NG gestört“ und „Alexa-Ansage misslungen“, Texte wie in der Liste. Jede bekommt genau eine Leitung."
BS1_S8 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Liste, nach der Spalte „%s“ von oben nach unten verbinden. Status-Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein: am Status „Alexa NG“ viermal (V5–V8). ODER und UND haben je zwei Eingänge. Die Zeilen der Status-Bausteine und die Mitteilungstexte stehen in der Spalte „%s“ und werden von Hand eingetragen – in der angegebenen Reihenfolge, die Zeile ohne Bedingung zuletzt; bei den beiden Ansage-Status ist die letzte Zeile der Text „0“."
BS1_S9 = "Speichern und übertragen. Probe: Taste „Türklingel (eigene Quelle)“ in der App – der Echo „kueche“ sagt den Satz; der Status „Alexa NG“ zeigt „in Ordnung – … Echos online“."
BS1_H1 = "Ansagetexte schreiben Sie in die Zeilen der Status-Bausteine; die letzte Zeile „0“ heißt „nichts sagen“. Eigene Auslöser hängen Sie an V2, V3 … mit je einer Zeile davor."
BS1_H2 = "Ausfall: Die Analogwertvalidierung (#25) wacht über alexang_status_zaehler (Tmc 900 s, drei Takte); #19 alexang_status_anmeldung unterscheidet im Status „Anmeldung abgelaufen“ von „Amazon antwortet nicht“."
BS1_H3 = "Die Sperre geht als Befehl #13 über MQTT; sie wirkt nur auf Ansagen und nur mit Haken „Sperre aus Loxone annehmen“. Nach einem Plugin-Update ist sie „offen“, bis Loxone sie das nächste Mal umschaltet."
BS1_H4 = "Eine Routine startet nur, wenn ihr Name in der Freigabeliste steht; sonst quittiert die Brücke ROUTINE_NICHT_FREIGEGEBEN. Für jede Routine der Freigabeliste liefert die Vorlage MQTT-Befehle einen Befehl."
BS1_H5 = "Die Ruhezeit für die Nacht stellt man im Plugin ein (Reiter „%s“), nicht in Loxone."
BS1_H6 = "Die Lautstärke nicht im Sekundentakt ändern: jede Änderung ist ein Aufruf bei Amazon (höchstens 60 je Stunde, zusammen mit den Ansagen)."
BS1_H7 = "Analogwertvalidierung #25: Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
BS2_S1 = "Im Plugin Reiter „%s“ Haken „Radio je Zone erlauben“ setzen, „%s“ (Nr. 1–8 für die Radiotasten) und „%s“ ausfüllen (im Muster Zone 1 = kueche, Zone 2 = wohnzimmer). Speichern."
BS2_S2 = "Die Befehle am Ausgang „LoxBerry MQTT-Gateway“ anlegen wie in der Liste – oder „%s“ (Schritt 3) drücken und die Datei EINMAL einlesen: Baum links Virtuelle Ausgänge → Menüband Vordefinierte Geräte → Vorlage Importieren…."
BS2_S3 = "Seite „Alexa NG Radio“ anlegen; die Befehle „Alexa NG: Radio Zone 1 …“, „Alexa NG: Radio Zone 2 …“ und „Alexa NG: Radio alle Zonen …“ auf die Seite ziehen."
BS2_S4 = "Je Zone Radiotasten setzen (Taste F5), die Tasten wie die Sender benennen, Text für „keine Taste gewählt“ = „Alles aus“, Remanenz aus. Je Zone eine Taste „… aus“ und einen Schieberegler anlegen; „Niemand zu Hause (eigene Quelle)“ aus dem Baum ziehen."
BS2_S5 = "Verbinden wie in der Liste. Drei Leitungen von Hand ziehen: #3 „Radio Zone 1 aus“ → #1 Eingang R, #9 „Radio Zone 2 aus“ → #7 Eingang R, #17 „Radio überall stoppen“ → #13 Eingang R. R stellt die Radiotasten auf „Alles aus“ zurück. ODER hat zwei Eingänge."
BS2_S6 = "Speichern und übertragen. Probe: Taste 1 in „Radio Zone 1“ – der Echo spielt Sender Nr. 1; im Plugin Reiter „%s“, Abschnitt Radio je Zone, steht der letzte Befehl."
BS2_H1 = "Nach „Radio überall aus“ zeigen die Radiotasten der einzelnen Zonen noch den alten Sender – dort „Alles aus“ tippen."
BS2_H2 = "Was der Echo gerade wirklich spielt, meldet Amazon nicht; die Radiotasten zeigen nur, was Loxone zuletzt geschickt hat."
BS2_H3 = "Die Sperre der Ansagen und die Ruhezeit gelten für Radio nicht."
BS2_H4 = "Weitere Zonen: je Zone dieselben sechs Zeilen mit ihrer Nummer; die Vorlage MQTT-Befehle liefert die Befehle für jede Zone der Zonentabelle."
BS3_S1 = "Im Plugin Reiter „%s“, Abschnitt Alexa → Loxone: „%s“ setzen, als Art die eigene Netzadresse (Docker, freie IP) wählen und unter „%s“ je Gerät Name, Art (Schalter, Licht, Dimmer, Taster/Szene) und Kürzel eintragen (im Muster Kaffeemaschine/Schalter, Stehlampe/Licht, Esstisch/Dimmer, Kinoabend/Taster). Speichern; dann am Echo „Alexa, suche Geräte“."
BS3_S2 = "Je Lampe die Eingänge der Namenstabelle als Virtuelle Eingänge anlegen (alexang_hue_<kürzel>_ein, beim Dimmer dazu …_helligkeit; Gateway Fassung 2: Haken setzen). Die Rückmeldungen sind Befehle am Ausgang „LoxBerry MQTT-Gateway“ – oder „%s“ drücken und einmal einlesen."
BS3_S3 = "Seite „Alexa NG Lampen“ anlegen, Eingänge und Rückmeldebefehle auf die Seite ziehen; je Lampe Flankenerkennung (Pd 0,1 s) und Schalter, beim Dimmer Dimmer, NICHT und UND, beim Taster/Szene einen Monoflop (1 s) setzen (Taste F5) und verbinden wie in der Liste. Den Ausgang Q bzw. AQ an Ihren echten Aktor oder Ihre Szene legen."
BS3_S4 = "Von Hand verbinden: an den Schaltern #3 und #7 On ← Ausgang On und Off ← Ausgang Off der Flankenerkennung davor (#2 bzw. #6); am Dimmer #14 Tg ← #13, Off ← Ausgang Off von #11, Set ← #10; Ausgang Q der Schalter an die Rückmeldungen #4 und #8, Ausgang Q des Dimmers an #15 und an #12, sein Ausgang AQ an #16; #17 an den Monoflop #18."
BS3_S5 = "Speichern und übertragen. Probe: „Alexa, schalte Stehlampe ein“ – der Schalter geht an; in der App ausschalten – die Alexa-App zeigt kurz danach „aus“."
BS3_H1 = "Flankenerkennung statt NICHT: ein Dauersignal am Aus-Eingang sperrt eine Lichtsteuerung; der kurze Impuls (Pd 0,1 s) schaltet nur aus. Ob Config 0,1 s annimmt und der Schalter Off wie die Lichtsteuerung behandelt, ist am Miniserver nicht gemessen – zuerst mit einer Lampe ausprobieren."
BS3_H2 = "Weitere Lampen: je Lampe der Freigabeliste dieselben Zeilen; bei Schalter und Licht (an/aus) entfallen Helligkeit, NICHT und UND, beim Taster/Szene alles außer Eingang und Monoflop. Schaltet Alexa einen Dimmer nur ein, kommt nur „…_ein“, die Helligkeit erst, wenn Alexa eine nennt."
BS3_H3 = "Ändert man die Art einer Lampe im Plugin, muss sie in der Alexa-App gelöscht und neu gesucht werden (Schritt 5, „Alexa zeigt alte Art oder alten Namen“)."
BS3_H4 = "Seit 1.0.6 spiegelt das Plugin die Rückmeldung: schaltet jemand in der App oder in Loxone aus, nachdem Alexa eingeschaltet hatte, schickt es …_ein = 0 hinterher – ein erneutes „Alexa, … ein“ wirkt dann wieder. Ohne Rückmeldung bleibt es wie bisher."
BS3_H5 = "Tür, Tor, Garage, Alarm, Schloss nur mit Haken „%s“ – im Muster keine."
BS3_H6 = "Taster/Szene (#17, #18): „aus“ sendet nichts und es gibt keine Rückmeldung; der Monoflop macht den kurzen Puls zum sicheren Impuls für die eigene Szene."
