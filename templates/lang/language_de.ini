NAMEN_HILFE = "Sprachsichere Namen: Für Ansagen aus Loxone zählt der Normalname, nicht die Aussprache. Gut sind kurze, eindeutige Namen, die nur ein Gerät meinen (kueche, flur_oben). Endet ein Normalname auf _2, heißen bei Amazon zwei Geräte gleich – dort eines umbenennen und die Geräteliste neu holen; der vergebene Normalname bleibt dabei. „alle“ und „gruppe“ sind vergeben. Für den Start aus Loxone zählt bei Routinen nur der Name in der Freigabe. Sprechen Sie eine Routine auch selbst, wählen Sie Sprachauslöser ohne Musik-, Sender- oder Genrewörter (nicht „Radio an“, sondern z. B. „Loxone Abendlicht“) – sonst fängt Alexa sie als Musikwunsch ab."
H_SPERRE = "Sperre aus Loxone"
