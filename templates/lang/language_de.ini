PLUGINS_TEXT = "Sprachsteuerung lokal (ab 0.11.12), Octopus Dynamic (ab 1.1.18), Abfuhrkalender (ab 1.4.17), Abfahrts-Assistent (ab 1.6.19) und Ferien und Feiertage (ab 1.2.18) haben die Ausgabeart „Alexa-NG“: dort Gerät (leer = Standardgerät) und das Sprechtoken aus dem Reiter Einstellungen eintragen. Die Ansage geht per POST (aktion=sprechen), das Sprechtoken steht in keiner Adresse. Nur als Rückfall für fremde Plugins mit einer URL-Vorlage dient die Adresse unten: sie trägt das Sprechtoken in der Adresse (wie ein Kennwort behandeln, es kann im Zugriffsprotokoll des Webservers landen); als IP 127.0.0.1, als Zonen die Normalnamen (kueche,flur oder gruppe:unten), {vol} nicht verwenden, eine Lautstärke fest als &laut=35 anhängen."
