L_ROUTINE = "Allow routines via MQTT (in addition to the release list)"
ROUTINE_HILFE = "Third stage for routines only, read fresh for every command: without this tick the bridge acknowledges “abgelehnt: ROUTINE_MQTT_AUS”. With it, anyone allowed to write to the broker in the home network can start released routines."
