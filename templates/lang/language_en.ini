HUE_HILFE = "How to measure: 1. Tab Settings, section Hue test: set the tick, choose the kind, save. 2. Above, “Is the Hue test running?” must show yes, “Does the Hue test answer?” as well. 3. In the Alexa app “Discover devices” (Philips Hue) or “Alexa, discover devices”. 4. Here “Has an Echo search arrived?” must show an address (the Echo’s), then “description fetched” and “light queried” with counters. 5. If the app finds “Loxone Probe”: “Alexa, turn on Loxone Probe” – “light switched” counts up and MQTT sends hue_probe/ein = 1. If no search arrives or the query stays out, this Echo does not support the local Hue discovery on this port – that is a measurement, not a fault of the plugin. With an own network address the self test asks the container via its bridge address: from the LoxBerry itself the own address cannot be reached (macvlan) – that is normal. The counters stay until the next update."
