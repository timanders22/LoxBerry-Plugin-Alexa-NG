[EINST]
WAS_IST_DAS_KURZ = "Lets Amazon Echo devices speak what Loxone or another plugin wants to say."
WAS_IST_DAS = "The plugin logs in with an Amazon account and sends announcements to one Echo, a group or all of them, sets the volume and starts released routines – triggered by the Miniserver through an address on the LoxBerry or over MQTT. A status line and the device list go back to Loxone. On request it emulates a Hue bridge so that an Echo switches lights from a release list locally (off by default)."
H_ALLGEMEIN = "General"
L_AKTIV = "Plugin active"
AKTIV_HILFE = "When switched off, the endpoint answers every triggering call with 409 “plugin is switched off”; status and device list stay readable."
L_STANDARD = "Default device"
O_KEIN = "– none –"
O_UNBEKANNT = "not in the device list"
STANDARD_HILFE = "Used when a call names no device. Without a default device such a call is rejected with 400."
STANDARD_VORSCHLAG = "Suggested because it is the only device that can speak – it is saved only with “Save”."
H_GRUPPEN = "Own groups"
GRUPPEN_HILFE = "Group name and the normal names of the devices, separated by commas. Call with geraet=gruppe:<name>. “alle” is reserved and means every device that is online."
T_GRUPPE = "Group"
T_GERAETE = "Devices (normal names)"
H_BREMSE = "Command brake"
L_FENSTER = "Repeat brake (seconds, 0 = off; for announcements at most 5)"
FENSTER_HILFE = "The same command to the same device within this window is not sent again. For announcements and notices at most 5 s apply (double trigger): answer 429 with GRUND=DOPPELT, not reported as sent; a later repetition is spoken. Routine, volume and music: answer 200 with UNVERAENDERT. Default 5 s (up to 1.0.11: 30 s)."
L_ABSTAND = "Minimum interval for a different text (seconds, 0 = off)"
ABSTAND_HILFE = "Off by default. When on, a call that comes too early is rejected with 429 and WARTE – the announcement is then lost."
L_STUNDE = "Limit per hour (10 to 240)"
STUNDE_HILFE = "Across all calls to Amazon; above it 429 STUNDENGRENZE. Default 60."
H_RUHE = "Quiet time"
L_RUHE = "Enable quiet time"
L_VON = "from"
L_BIS = "until"
RUHE_HILFE = "During quiet time nothing is spoken (409 with UEBERSPRUNGEN, GRUND=RUHEZEIT - not reported as sent). dringend=1 in the call overrides it. Volume and routines still work."
H_FREIGABEN = "Releases"
L_ANKUENDIGEN = "Allow announcements (not tested on a device)"
ANKUENDIGEN_HILFE = "Announcements use the node type AlexaAnnouncement. It is only known from third-party libraries and has not been measured on any Echo. Off by default; without the tick the endpoint answers 409."
L_ROUTINEN = "Routines Loxone may start (e.g. Radio on)"
ROUTINEN_HILFE = "Only these routines can be started, and only with the action token. Empty by default. A routine may trigger locks or purchases – only enter what may run from Loxone."
L_TEXTE_LOG = "Log announcement texts (shortened to 60 characters)"
TEXTE_LOG_HILFE = "Off by default: texts name people and daily routines. Without the tick the log only shows the length."
H_ROUTINEN = "Routines"
P_ROUTINEN = "One name or voice trigger per line, exactly as in the Alexa app – e.g. Radio on"
ZU_ROUTINEN_AMAZON = "The tab Devices shows the names under “Show routines at Amazon”."
NAMEN_HILFE = "Speech-safe names: announcements from Loxone use the normal name, not the pronunciation. Good names are short and unique and mean one device only (kueche, flur_oben). A normal name ending in _2 means two devices have the same name at Amazon – rename one there and fetch the device list again; the assigned normal name stays. “alle” and “gruppe” are reserved. For a start from Loxone only the name in the release list counts. If you also speak a routine yourself, choose voice triggers without music, station or genre words (not “Radio on”, but e.g. “Loxone evening light”) – otherwise Alexa takes them as a music request."
H_SPERRE = "Lock from Loxone"
L_SPERRE = "Accept the lock from Loxone (off by default)"
SPERRE_HILFE = "Loxone sets the lock e.g. for away, guests or sleeping: aktion=sperre&wert=1 with the action token or the MQTT topic befehl/sperre with 1, release with 0 (addresses in the tab Loxone integration). While locked, announcements are skipped (409, GRUND=GESPERRT, not reported as sent); dringend=1 passes. Volume, routines and the music test still work. The last value is kept; after an update it is gone, then “open” applies until Loxone sets it again – the tab Test shows this."
SPERRE_JETZT = "State now: %s"
H_MUSIK = "Music test (stage 3)"
L_MUSIK = "Allow the music test (measured on one Echo)"
MUSIK_HILFE = "Plays a station via the search of the Echo (node type Alexa.Music.PlaySearchPhrase). Unofficial interface; measured on one Echo on 02.10.2026: a TuneIn station by number played, sound after about 3 s (Amazon Music and Amazon groups not measured). Only what Amazon itself finds at TuneIn or Amazon Music is played – no arbitrary stream, no address, no own MP3. Off by default; without the tick the endpoint answers 409 GRUND=MUSIK_AUS."
L_MUSIK_STUNDE = "Music limit per hour (10 to 240)"
MUSIK_STUNDE_HILFE = "Counted separately from announcements; above it 429 GRUND=MUSIK_STUNDENGRENZE. Default 30."
H_SENDER = "Stations (for music test and radio per zone)"
L_MUSIK_SENDER = "Station list (per line: number = station name | provider)"
P_MUSIK_SENDER = "1 = Bayern 3 | tunein"
MUSIK_SENDER_HILFE = "Number 1 to 50, each only once; provider tunein or amazon, tunein if omitted. The list applies to the music test and to radio per zone and needs neither tick. Call with nr=<number> (main way, fits the radio buttons 1–16 in Loxone) or, for the music test, with sender=<name> as an addition. Empty by default."
H_RADIO = "Radio per zone (stage 3)"
L_RADIO = "Allow radio per zone (off by default, several zones not tried on a device)"
RADIO_HILFE = "Plays a station from the station list (above, by number) per zone via the same direct music command as the music test – unofficial interface. Proven on a device is one Echo; several zones at once are only tested against the mock. No arbitrary stream, no address, no own MP3. Commands only with the action token: aktion=radio, radio_stopp and radio_laut with zone=1–24 or alle (addresses in the tab Loxone integration). The lock from Loxone and the quiet time do not apply to radio. The same station, a stop or the same volume in the same zone within 60 s is not sent again (UNVERAENDERT=1). The music limit per hour applies to all zones together. Without the tick the endpoint answers 409 GRUND=RADIO_AUS."
L_RADIO_ZONEN = "Zone table (per line: number = target)"
P_RADIO_ZONEN = "1 = kueche · 2 = amazon:unten · 3 = gruppe:oben"
RADIO_ZONEN_HILFE = "Number 1 to 24, each only once. The target is the normal name of an Echo (tab Devices), amazon:<name> for a multi-room music group of the Alexa app (as a whole, in sync – not measured) or gruppe:<name> for an own group from above (each device on its own, not in sync). Lower case as in the tab Devices. Empty by default."
H_HUE = "Alexa → Loxone (Hue lights, version 2)"
L_HUE = "Switch on the Hue emulation"
HUE_HILFE = "Version 2: an emulation of a Hue bridge in the home network, so that Alexa switches lights controlled by Loxone – locally, without cloud. Off by default. With the tick an own service runs: it answers the search for a bridge (SSDP, UDP port 1900, only as an answer to the searcher) and shows the lights of the list below, plus – with its own tick – the test light “Loxone Probe”. If an Echo switches a light, only alexang/hue/<code>/ein (1 or 0, not retained) and for a dimmer …/helligkeit go out via MQTT; what follows is decided by your logic in Loxone. Procedure: enter lights, set the tick, save; in the Alexa app “Discover devices” (Philips Hue) or “Alexa, discover devices”; check the tab Test. Measured on 03.10.2026: an Echo found the emulation on an own network address (port 80), queried the test light and switched it; on port 8380 it never queried. Also measured on 03.10.2026: an Echo found lights of the list and switched them. Echo devices of the newer generation partly no longer support the local Hue discovery. That is why there is the kind “own network address (Docker)” below: the emulation gets an own IP in the home network and listens on port 80 there."
HUE_PORT_HILFE = "HTTP port of the emulation on the LoxBerry, 1024 to 65535, 8380 by default. Not 80: the LoxBerry web server runs there. Applies only to the kind “on the LoxBerry”; with an own network address it is always port 80. If the port is taken, the tab Test shows the reason."
ZU_HUE_TEST = "Measurements of the Hue test in the tab Test"
O_HUE_LOXBERRY = "on the LoxBerry (port as before)"
O_HUE_DOCKER = "own network address (Docker)"
HUE_ART_HILFE = "On the LoxBerry: the service listens on the port above (not 80). Own network address: a container with an own IP listens on port 80 – for Echos that query a bridge only there."
P_HUE_IP = "192.168.178.x"
HUE_IP_HILFE = "Required with “own network address”: a free IPv4 in the network of the interface (pattern 192.168.178.x), not .0 or .255, not the address of the LoxBerry, not the one of the router. In the Fritzbox it must lie outside the DHCP range or be reserved there. On saving it is checked whether a device already uses it (ping and ARP). Empty by default."
HUE_SCHNITTSTELLE_HILFE = "The LoxBerry interface to the home network, eth0 by default. The own IP must lie in its network."
HUE_DOCKER_HINWEIS = "Own network address (decision no. 41, measured with an Echo on 03.10.2026): via Docker the plugin creates a container lb-alexang-hue – with an own IP in the home network (network lb-alexang-macvlan, macvlan on the interface) and additionally on the Docker network bridge, so it reaches the MQTT broker on the LoxBerry. Only this plugin’s own service runs in it, on the official image php:8.4-cli (built on the LoxBerry the first time: internet needed, some minutes). Apache, web port and Loxone addresses stay untouched. Docker must be installed. From the LoxBerry itself the own address cannot be reached (macvlan) – that is normal. Without the tick or with kind “on the LoxBerry” container and network are removed; the image stays."
H_HUE_LAMPEN = "Lights for Alexa (release list)"
HUE_LAMPEN_HILFE = "One light per row, as Alexa calls it (at most 32 characters, unique), the kind and a code for the MQTT topic (lower case letters, digits and _ only; if it stays empty it is rejected and a proposal from the name is put into the field). Kind: switch for sockets, pumps and the like (the Alexa app shows an on/off switch); light (on/off) for lights without dimming – meant so that room commands like “Alexa, lights off” include them (the Alexa app shows it as a light; whether a room command includes it is not measured on an Echo); dimmer for lights with brightness. Names with door, gate, garage, alarm or lock (also German) need the tick “release deliberately” – in the home network every released Echo can switch them. At most 50 lights. The list is empty by default."
L_HUE_PROBE_LAMPE = "Show the test light “Loxone Probe”"
HUE_PROBE_LAMPE_HILFE = "The test light of version 0.9.5 (Hue ID 1); it only switches alexang/hue_probe/ein. Visible by default, so that an update takes nothing away. Once your own lights work the tick can go; Alexa then shows “Loxone Probe” as unreachable until you delete it in the Alexa app."
T_HUE_NAME = "Name in Alexa"
T_HUE_ART = "Kind"
T_HUE_KUERZEL = "Code (MQTT topic)"
T_HUE_FREI = "Door, gate, alarm …"
O_HUE_SCHALTER = "Switch"
O_HUE_LICHT = "Light (on/off)"
O_HUE_DIMMER = "Dimmer"
O_HUE_TASTER = "Push button/scene"
P_HUE_KUERZEL = "e.g. kitchen_light"
L_HUE_FREI = "release deliberately"
HUE_LAMPEN_ZEILEN_HILFE = "Clearing a row (name and code) deletes the light. Every light keeps its ID, also when renamed – Alexa maps by this ID. So rename like this: rename here, save, “Discover devices” in the Alexa app – only then change the name in the Alexa app if needed. A deleted ID is never given out again. If the kind of a light is changed (switch, light, dimmer), delete the light in the Alexa app and then “Discover devices”. Alexa remembers the kind per device; it cannot be changed in the app."
P_HUE_ECHOS = "empty = all in the home network"
HUE_ECHOS_HILFE = "Only these Echos may query and switch the lights: IP addresses in the network of the interface above, separated by comma or space (pattern 192.168.178.x), at most 20. Empty (default) means: all devices in the home network. Requests of other addresses get an error answer of the Hue interface and are counted in the tab Test. The Echos then need fixed addresses (reserve them in the Fritzbox)."
H_TOKEN = "Speech and action token"
TOKEN_HILFE = "The speech token allows speaking, announcing and volume; it belongs into Loxone outputs and the templates of other plugins. The action token additionally allows routines and the device list with serial numbers. Both are created when this page is first opened."
T_TOKEN = "Token"
T_BEISPIEL = "Complete example address"
SPRECHTOKEN = "Speech token"
AKTIONSTOKEN = "Action token"
TOKEN_GLEICH = "Speech and action token are identical – the separation has no effect. Renew one of them."
L_TOKEN_JA = "Yes, I will enter all addresses again afterwards."
K_SPRECH_NEU = "Renew speech token"
K_AKTION_NEU = "Renew action token"
TOKEN_NEU_WARNUNG = "A new token invalidates every address carrying the old one – in the Miniserver and in other plugins. A virtual output does not evaluate the 403 answer; announcements then silently stop."
HUE_TASTER_HILFE = "Push button/scene: Alexa shows a plug that is “off” after every switching; “on” sends a short pulse (1, immediately followed by 0) to Loxone, “off” sends nothing – for scenes like “Alexa, turn on Kinoabend”. In Loxone a monoflop (1 s) turns it into a reliable pulse."
E5_TITEL = "Alexa shows old kind or old name"
E5_1 = "Delete the light in the Alexa app under Devices."
E5_2 = "Say “Alexa, discover devices” or in the app “Add device → Other → Discover devices”."
E5_3 = "Only then assign routines and groups in the app again."
E5_HINWEIS = "Applies after every change of kind (also to push button/scene) and after a new light ID."

