S0 = "MQTT is the way of the sample project, for values AND commands: values arrive as simple virtual inputs via the MQTT gateway, commands go as virtual output commands to the output “LoxBerry MQTT-Gateway”. The HTTP endpoint stays for other plugins and existing installations (below, collapsed)."
M_S1 = "Values: the MQTT gateway."
M_V1_BEFEHLE = "The subscription prefix/# also takes commands, acknowledgements and feedbacks; the gateway assigns them only by name – an input for them exists only if it has been created in Loxone Config with exactly this title (also for the announcement text). No command title equals one of them – no endless loop. If you do not want that, use gateway version 2."
M_S1_V2 = "Gateway version 2: under prefix %s tick these %d data points; enter nothing."
M_HAKEN_AUF = "Tick list (%d ticks)"
M_T_THEMA = "Topic"
M_T_NAME = "Name of the input (as the gateway assigns it)"
M_T_NONCACHED = "Noncached"
M_T_BEREICH = "Range"
M_T_ART = "Kind"
M_T_MUSTER = "in the sample project"
M_ART_ZAHL = "number"
M_ART_TEXT = "text"
M_NONCACHED = "Noncached for status/ok, status/anmeldung and status/befehle: the first two arrive every cycle, status/befehle from the command bridge, all mostly with the same value. After a restart of the Miniserver version 2 otherwise only sends changes, and the status would report “disturbed” until the next synchronisation."
M_RECONNECT = "The central synchronisation after a Miniserver restart (reconnect) is shown on the page “LoxBerry MQTT-Gateway” of the sample project."
M_MQTT_AUS = "MQTT is switched off (tab MQTT) – nothing arrives."
M_S2 = "Create inputs: one virtual input per name, title exactly as here."
M_KOPIEREN = "copy"
M_KOPIERT = "copied"
M_S2_DIGITAL = "Do not tick “Use as digital input” – otherwise -1 would arrive as 1."
M_S2_TEXT = "Create texts (letzte/grund, letzte/geraet) as virtual text input."
M_S2_FEHLWERT = "-1 means “unknown or none yet” (device list not fetched, no announcement yet)."
M_S2_RECHTE = "The LoxBerry user at the Miniserver needs rights on these inputs."
M_S2_MUSTER = "If you copy the pages of the sample project, you get the inputs with them."
M_S2_PRAEFIX = "A different prefix (tab MQTT) changes all names."
M_S3 = "Commands: the command bridge subscribes to %s; one virtual output command per command at the output “LoxBerry MQTT-Gateway”."
M_S3_KEINE = "The command list is not available (command bridge missing or its table broken – tab Test)."
M_S3_NICHTS = "For commands nothing needs to be entered or ticked with gateway version 1 or 2."
M_S3_TEXT = "Loxone inserts the announcement text into <v> (status block, output TQ). Whether umlauts and spaces arrive via the UDP input is to be measured on the device."
M_S3_HAKEN = "Commands only work with “Accept commands via MQTT”; announcements, volume, radio and routines additionally with “Control Echos via MQTT”, routines also with “Routine per MQTT erlauben” (tab MQTT)."
M_S3_VORLAGE = "The template creates an own virtual output “Alexa NG MQTT-Befehle” to the UDP input of the MQTT gateway: announcement and volume per Echo, all, groups, lock, per released routine, radio per zone, light feedbacks. It carries no token."
M_S4 = "Failure detection: an analog value validation at %s (Tmc 900 s, remove the tick at ‚En‘); %s distinguishes an expired login. No age formula."
M_S5 = "Lights for Alexa (Alexa → Loxone): per light the inputs of the name table and the feedback as a command at the shared output."
M_S5_KEINE_RUECK = "Push button/scene: no feedback needed"
M_S5_TASTER = "Push button/scene: “Alexa, turn on …” sends …_ein = 1 and immediately 0; a monoflop (1 s) in Loxone turns it into a reliable pulse. Whether Loxone reliably sees the short pulse is to be measured on the Miniserver."
M_S5_SPIEGEL = "Mirroring: if a feedback differs from the …_ein sent last, the emulation sends the value once afterwards – so a second “Alexa, … on” works after switching off in the app. Against switching loops at most three times per light and minute, then a ten-minute pause with a warning in the log."
M_S7 = "Counter-check: look at the row of the command bridge (last acknowledgement) in the tab Test; in Loxone %s rises by 1 every 5 minutes."
H_HTTP = "Existing installations and other plugins: way via HTTP"
HTTP_ERKLAERUNG = "Up to 1.0.5 the way of the sample project. It stays unchanged; the templates for announcements, radio and actions carry a token."
