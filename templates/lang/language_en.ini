BS1_S1 = "In the plugin log in on the tab “%s”; the tab “%s” shows your Echos with their “normal name” (e.g. kueche) – try “%s”."
BS1_S2 = "Tab “%s”: choose the “%s”, tick “Accept the lock from Loxone” and enter the names of your Alexa routines under “%s” (in the sample “Gute Nacht” and “Haus verlassen”; the tab “%s” shows the exact names with “%s”). Save."
BS1_S3 = "Tab “MQTT”: tick “%s”, “%s” and “%s”, for the routines additionally “%s”. Save."
BS1_S4 = "Release the values in the MQTT gateway (step 1 above) and create a virtual input per name of the name table (step 2) (Periphery → Virtual inputs → Virtual input), title exactly as in the table, do not tick “Use as digital input”. alexang_letzte_grund becomes a virtual text input, “Use in visualisation” on."
BS1_S5 = "Create the commands (no. 3, 6, 9, 13, 15, 16) as virtual output commands at the output “LoxBerry MQTT-Gateway”, command as in the list – or press “%s” in step 3 and import the file once (tree on the left Virtual Outputs → ribbon Predefined devices → Import template…)."
BS1_S6 = "Create the page “Alexa NG” and drag the inputs and outputs of the list onto the page. Take “Türklingel (eigene Quelle)”, “Niemand zu Hause (eigene Quelle)” and “Konstante 1” from the tree if they already exist. Create new: slider “Alexa Küche Lautstärke (Proz)”, switch “Alexa-Ansagen sperren”, push button “Routine Gute Nacht”."
BS1_S7 = "Create two notifications (Periphery → Messages → Notification): “Alexa NG gestört” and “Alexa-Ansage misslungen”, texts as in the list. Each gets exactly one connection."
BS1_S8 = "Place the remaining blocks via the block search (key F5), parameters as in the list, and wire them from top to bottom according to the column “%s”. Status inputs from V5 only appear after clicking the “+” on the block: four times on the status “Alexa NG” (V5–V8). OR and AND have two inputs each. The rows of the status blocks and the message texts are in the column “%s” and are entered by hand – in the given order, the row without condition last; for the two announcement status blocks the last row is the text “0”."
BS1_S9 = "Save and transfer. Test: push button “Türklingel (eigene Quelle)” in the app – the Echo “kueche” speaks the sentence; the status “Alexa NG” shows “OK – … Echos online”."
BS1_H1 = "You write announcement texts into the rows of the status blocks; the last row “0” means “say nothing”. Connect your own triggers to V2, V3 … with one row each in front."
BS1_H2 = "Failure: the analog value validation (#25) watches alexang_status_zaehler (Tmc 900 s, three cycles); #19 alexang_status_anmeldung distinguishes “login expired” from “Amazon does not answer” in the status."
BS1_H3 = "The lock goes as command #13 via MQTT; it only affects announcements and only with the tick “Accept the lock from Loxone”. After a plugin update it is “open” until Loxone switches it next time."
BS1_H4 = "A routine only starts when its name is in the release list; otherwise the bridge acknowledges ROUTINE_NICHT_FREIGEGEBEN. For every routine of the release list the template MQTT commands provides a command."
BS1_H5 = "The quiet time for the night is set in the plugin (tab “%s”), not in Loxone."
BS1_H6 = "Do not change the volume every second: every change is a call to Amazon (at most 60 per hour, together with the announcements)."
BS1_H7 = "Analog value validation #25: Config creates input En inverted (tick at ‚En‘ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
BS2_S1 = "In the plugin, tab “%s”, tick “Allow radio per zone”, fill in the “%s” (no. 1–8 for the radio buttons) and the “%s” (in the sample zone 1 = kueche, zone 2 = wohnzimmer). Save."
BS2_S2 = "Create the commands at the output “LoxBerry MQTT-Gateway” as in the list – or press “%s” (step 3) and import the file ONCE: tree on the left Virtual Outputs → ribbon Predefined devices → Import template…."
BS2_S3 = "Create page “Alexa NG Radio”; drag the commands “Alexa NG: Radio Zone 1 …”, “Alexa NG: Radio Zone 2 …” and “Alexa NG: Radio alle Zonen …” onto the page."
BS2_S4 = "Per zone place radio buttons (key F5), name the buttons like the stations, text for “no button selected” = “Alles aus”, remanence off. Per zone create a push button “… aus” and a slider; drag “Niemand zu Hause (eigene Quelle)” from the tree."
BS2_S5 = "Wire as in the list. Draw three connections by hand: #3 “Radio Zone 1 aus” → #1 input R, #9 “Radio Zone 2 aus” → #7 input R, #17 “Radio überall stoppen” → #13 input R. R resets the radio buttons to “Alles aus”. OR has two inputs."
BS2_S6 = "Save and transfer. Test: button 1 in “Radio Zone 1” – the Echo plays station no. 1; in the plugin, tab “%s”, section radio per zone, shows the last command."
BS2_H1 = "After “Radio überall aus” the radio buttons of the single zones still show the old station – tap “Alles aus” there."
BS2_H2 = "Amazon does not report what the Echo is really playing; the radio buttons only show what Loxone sent last."
BS2_H3 = "The announcement lock and the quiet time do not apply to the radio."
BS2_H4 = "More zones: per zone the same six rows with its number; the template MQTT commands provides the commands for every zone of the zone table."
BS3_S1 = "In the plugin tab “%s”, section Alexa → Loxone: tick “%s”, choose the own network address (Docker, free IP) as kind and enter name, kind (switch, light, dimmer, push button/scene) and code per device under “%s” (in the sample Kaffeemaschine/switch, Stehlampe/light, Esstisch/dimmer, Kinoabend/push button). Save; then on the Echo “Alexa, discover devices”."
BS3_S2 = "Per light create the inputs of the name table as virtual inputs (alexang_hue_<code>_ein, for a dimmer also …_helligkeit; gateway version 2: set the ticks). The feedbacks are commands at the output “LoxBerry MQTT-Gateway” – or press “%s” and import once."
BS3_S3 = "Create page “Alexa NG Lampen”, drag inputs and feedback commands onto the page; per light set edge detection (Pd 0.1 s) and switch, for a dimmer dimmer, NOT and AND, for a push button/scene a monoflop (1 s) (key F5) and connect as in the list. Connect output Q or AQ to your real actuator or your scene."
BS3_S4 = "Connect by hand: at the switches #3 and #7 On ← output On and Off ← output Off of the edge detection before (#2 or #6); at the dimmer #14 Tg ← #13, Off ← output Off of #11, Set ← #10; output Q of the switches to the feedbacks #4 and #8, output Q of the dimmer to #15 and to #12, its output AQ to #16; #17 to the monoflop #18."
BS3_S5 = "Save and transfer. Test: “Alexa, turn on Stehlampe” – the switch goes on; switch it off in the app – shortly afterwards the Alexa app shows “off”."
BS3_H1 = "Edge detection instead of NOT: a permanent signal at the off input locks a lighting controller; the short pulse (Pd 0.1 s) only switches off. Whether Config accepts 0.1 s and the switch treats Off like the lighting controller is not measured on the Miniserver – try it with one light first."
BS3_H2 = "More lights: per light of the release list the same rows; for switch and light (on/off) brightness, NOT and AND are dropped, for a push button/scene everything except input and monoflop. If Alexa only switches a dimmer on, only “…_ein” arrives, the brightness only when Alexa names one."
BS3_H3 = "If you change the kind of a light in the plugin, it must be deleted in the Alexa app and discovered again (step 5, “Alexa shows old kind or old name”)."
BS3_H4 = "Since 1.0.6 the plugin mirrors the feedback: if someone switches off in the app or in Loxone after Alexa had switched on, it sends …_ein = 0 afterwards – a new “Alexa, … on” then works again. Without feedback everything stays as before."
BS3_H5 = "Door, gate, garage, alarm, lock only with the tick “%s” – none in the sample."
BS3_H6 = "Push button/scene (#17, #18): “off” sends nothing and there is no feedback; the monoflop turns the short pulse into a reliable pulse for your own scene."
Z1_01 = "Virtual input (name as the MQTT gateway assigns it, plugin Alexa NG) | alexang_status_ok | 1 = the last plugin cycle ran without fault (Amazon answers); 0 = disturbed; arrives every 5 minutes (never retained) | —"
Z1_02 = "Status | Ansagetext | rows: V1 = 1 “Someone is at the front door”; without condition “0” (at 0 the plugin does not speak) | V1 = #4"
Z1_03 = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT) | Alexa NG: Küche sprechen | command on analogue value: publish alexang/befehl/kueche/sprechen <v> (never retain); speaks the text of #2 on the Echo “kueche” (name as in the plugin, tab Devices, column normal name); works only with the ticks “Befehle über MQTT annehmen” and “Echos über MQTT steuern” (tab MQTT) | Input = output TQ of #2"
Z1_04 = "Virtual input (push button) | Türklingel (eigene Quelle) | 1 = the doorbell rings; the same placeholder as on “Kodi-NG Wiedergabe” – in your own project connect your own doorbell to no. 2 instead of this push button | —"
Z1_05 = "Virtual input (slider) | Alexa Küche Lautstärke (Proz) | Min 0, Max 100, step 10, start value 30 | —"
Z1_06 = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT) | Alexa NG: Küche Lautstärke | command on analogue value: publish alexang/befehl/kueche/lautstaerke <v> (never retain); sets the volume of the Echo “kueche”; every change is a call to Amazon (counts towards the limit of 60 per hour); ticks as no. 3 | Input = #5"
Z1_07 = "Pulse at | Morgendurchsage 7:00 | At specific time 07:00:00 | —"
Z1_08 = "Status | Durchsage an alle | rows: V1 = 1 “Good morning. It is seven o’clock.”; without condition “0” | V1 = output Q of #7"
Z1_09 = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT) | Alexa NG: alle sprechen | command on analogue value: publish alexang/befehl/alle/sprechen <v> (never retain); speaks the text of #8 on all Echos that can speak; ticks as no. 3 | Input = output TQ of #8"
Z1_10 = "Virtual input (switch) | Niemand zu Hause (eigene Quelle) | 1 = everybody is away; the same placeholder as on “Kodi-NG Wiedergabe” – in your own project use your own presence signal (e.g. alarm system armed) instead of this switch | —"
Z1_11 = "Virtual input (switch) | Alexa-Ansagen sperren | in the app; on = the Echos announce nothing | —"
Z1_12 = "OR | Ansagen sperren | — (nobody at home or switch in the app) | I1 = #10, I2 = #11"
Z1_13 = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT) | Alexa NG: Ansagen sperren | command on ON: publish alexang/befehl/sperre 1, on OFF: publish alexang/befehl/sperre 0 (never retain); blocks announcements only – not radio, routines or lights; works with the tick “Befehle über MQTT annehmen” (tab MQTT) and “Sperre aus Loxone annehmen” (tab Settings) | Input = #12"
