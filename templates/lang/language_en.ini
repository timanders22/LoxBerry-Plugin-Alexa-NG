WAS_IST_DAS = "The plugin logs in with an Amazon account and sends announcements to one Echo, a group or all of them, sets the volume and starts released routines – triggered by the Miniserver through an address on the LoxBerry or over MQTT. A status line and the device list go back to Loxone. On request it emulates a Hue bridge so that an Echo switches lights from a release list locally (off by default)."
H_ALLGEMEIN = "General"
L_AKTIV = "Plugin active"
AKTIV_HILFE = "When switched off, the endpoint answers every triggering call with 409 “plugin is switched off”; status and device list stay readable."
L_STANDARD = "Default device"
O_KEIN = "– none –"
O_UNBEKANNT = "not in the device list"
STANDARD_HILFE = "Used when a call names no device. Without a default device such a call is rejected with 400."
STANDARD_VORSCHLAG = "Suggested because it is the only device that can speak – it is saved only with “Save”."
H_GRUPPEN = "Own groups"
GRUPPEN_HILFE = "Group name and the normal names of the devices, separated by commas. Call with geraet=gruppe:<name>. “alle” is reserved and means every device that is online."
