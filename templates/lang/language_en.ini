ABO_V1_DA = "Gateway version 1: the plugin enters its subscription %s itself in mqtt_subscriptions.cfg; the gateway reads the file."
ABO_UNBEKANNT = "Gateway version cannot be determined. Version 1: enter subscription %s. Version 2: enter nothing, tick the data points."
