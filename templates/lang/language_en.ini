BEFEHLE_HILFE = "The shared command bridge subscribes to prefix/befehl/# (the same topics as up to 1.0.5) and acknowledges every command. Retained commands are discarded, not executed. Anyone in the home network can send commands via the UDP input of the MQTT gateway – therefore off by default. The same checks and brake as the HTTP endpoint."
